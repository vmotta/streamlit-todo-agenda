[project]
name = "organiza"
version = "0.1.0"
description = "Organizador pessoal de tarefas e eventos em Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.19.1",
  "pydantic==2.13.4",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary]>=3.2.10,<4",
  "sqlalchemy==2.0.52",
  "streamlit==1.60.0",
  "streamlit-calendar==1.4.0",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/organiza"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["streamlit_calendar"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["ui: testes da interface Streamlit"]

[tool.coverage.run]
branch = true
source = ["src/organiza"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

